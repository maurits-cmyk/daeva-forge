name: Hourly prices
on:
  schedule:
    - cron: '20 * * * *'  # Aion2Market captures prices a few minutes past each hour
  workflow_dispatch:
  push:  # deploy page changes right away
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python hosting.py build
      - run: python hosting.py prices
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'  # the action's default (3.90) predates wrangler.jsonc
          command: deploy
