name: Daily sale speeds
on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  speeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python hosting.py speeds
      # committing also keeps the repository active, so GitHub doesn't pause the hourly schedule
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/speeds
          git diff --cached --quiet || { git commit -m "Update sale speeds" && git push; }
